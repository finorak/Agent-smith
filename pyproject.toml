[project]
name = "agent-smith"
version = "0.1.0"
description = "A sandbox to execute potontial non trusted code write in python and executed inside a docker"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "aiohttp>=3.14.5",
    "docker>=7.2.0",
    "fastmcp>=4.1.6",
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
]

[project.scripts]
sandbox = "sandbox.__main__:main"
test = "test.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]
# ovaina @ tokony ho izy any aorina any
only-include = ["sandbox", "http_.py", "stdio_.py", "server.py"]
